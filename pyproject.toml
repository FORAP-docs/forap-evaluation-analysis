[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forap-evaluation-analysis"
version = "0.2.0"
description = "Quantitative and qualitative analysis of FORAP expert-evaluation questionnaires"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "plotly>=5.24",
  "scipy>=1.13",
  "streamlit>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["forap_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
